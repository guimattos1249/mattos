  <image href="data:image/svg+xml;base64," x="78" y="52" width="430" height="104"/><text x="82" y="280" fill="#14b8a6" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start" letter-spacing="5">O QUE PODE ESTAR</text><text x="82" y="365" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="51" font-weight="800" text-anchor="start" letter-spacing="0">LIMITANDO SUA PRESENÇA?</text>
  <line x1="145" y1="500" x2="145" y2="1085" stroke="#31507e" stroke-width="5"/>
  <circle cx="145" cy="510" r="35" fill="#2563eb"/><text x="145" y="519" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="0">01</text><text x="205" y="505" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800" text-anchor="start" letter-spacing="0">GOOGLE DESATUALIZADO</text><text x="205" y="544" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">Informações antigas reduzem confiança.</text>
  <circle cx="145" cy="645" r="35" fill="#14b8a6"/><text x="145" y="654" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="0">02</text><text x="205" y="640" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800" text-anchor="start" letter-spacing="0">POUCAS INFORMAÇÕES</text><text x="205" y="679" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">O cliente não encontra respostas.</text>
  <circle cx="145" cy="780" r="35" fill="#2563eb"/><text x="145" y="789" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="0">03</text><text x="205" y="775" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800" text-anchor="start" letter-spacing="0">SITE FRACO OU INEXISTENTE</text><text x="205" y="814" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">A decisão perde força e clareza.</text>
  <circle cx="145" cy="915" r="35" fill="#14b8a6"/><text x="145" y="924" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="0">04</text><text x="205" y="910" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800" text-anchor="start" letter-spacing="0">BAIXA RELEVÂNCIA LOCAL</text><text x="205" y="949" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">Sua empresa aparece menos nas buscas.</text>
  <circle cx="145" cy="1050" r="35" fill="#2563eb"/><text x="145" y="1059" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="0">05</text><text x="205" y="1045" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800" text-anchor="start" letter-spacing="0">CONCORRENTES À FRENTE</text><text x="205" y="1084" fill="#cbd5e1" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">Outras marcas ocupam o espaço.</text>
  <text x="82" y="1295" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" letter-spacing="3">05 / 09</text><line x1="790" y1="1288" x2="995" y2="1288" stroke="#dbeafe" stroke-width="4" stroke-linecap="round"/><rect x="790" y="1284" width="113.88888888888889" height="8" rx="4" fill="#14b8a6"/>
