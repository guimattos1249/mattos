  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#174ecf"/><stop offset=".58" stop-color="#2563eb"/><stop offset="1" stop-color="#128d9a"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020b1d" flood-opacity=".18"/></filter>
