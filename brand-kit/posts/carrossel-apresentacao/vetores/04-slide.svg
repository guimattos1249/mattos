  <text x="88" y="260" fill="#2563eb" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start" letter-spacing="5">COMO TRABALHAMOS</text>
  <text x="88" y="345" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="800" text-anchor="start" letter-spacing="0">Do diagnóstico ao</text>
  <text x="88" y="410" fill="#2563eb" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="800" text-anchor="start" letter-spacing="0">crescimento.</text>
  <line x1="145" y1="535" x2="145" y2="1035" stroke="#dbe4f0" stroke-width="5" stroke-linecap="round"/>
  <circle cx="145" cy="555" r="46" fill="#2563eb"/><text x="145" y="566" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="0">01</text><text x="225" y="545" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" text-anchor="start" letter-spacing="0">DIAGNÓSTICO</text><text x="225" y="589" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">Entendemos o negócio, o público e os objetivos.</text>
  <circle cx="145" cy="710" r="46" fill="#14b8a6"/><text x="145" y="721" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="0">02</text><text x="225" y="700" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" text-anchor="start" letter-spacing="0">POSICIONAMENTO</text><text x="225" y="744" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">Organizamos a presença e tornamos a mensagem clara.</text>
  <circle cx="145" cy="865" r="46" fill="#2563eb"/><text x="145" y="876" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="0">03</text><text x="225" y="855" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" text-anchor="start" letter-spacing="0">EXECUÇÃO</text><text x="225" y="899" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">Colocamos sites, perfis e estratégias para funcionar.</text>
  <circle cx="145" cy="1020" r="46" fill="#14b8a6"/><text x="145" y="1031" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="0">04</text><text x="225" y="1010" fill="#0f172a" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" text-anchor="start" letter-spacing="0">EVOLUÇÃO</text><text x="225" y="1054" fill="#64748b" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">Acompanhamos resultados e identificamos oportunidades.</text>
